---
all:
  vars:
    ansible_python_interpreter: auto_silent
    ansible_user: root
  children:
    network:
      hosts:
        opnsense:
          ansible_host: 10.10.10.1
          guest_type: qemu
          vmid: 900
          guest_os: OPNsense
          network_interfaces: [vmbr1, vmbr0, vmbr2]

    cloud_workloads:
      hosts:
        openstack:
          guest_type: qemu
          vmid: 901
          vlan_id: 20
          guest_os: Linux
          role: private_cloud

    observability:
      hosts:
        monitoring:
          ansible_host: 10.10.10.14
          guest_type: lxc
          vmid: 910
          vlan_id: 10
          guest_os: Alpine Linux
          vcpu: 1
          memory_mb: 256
          role: prometheus_grafana_loki

    storage_monitoring:
      hosts:
        scrutiny:
          ansible_host: 10.10.10.11
          guest_type: lxc
          vmid: 907
          vlan_id: 10
          guest_os: Debian
          vcpu: 1
          memory_mb: 128
          role: disk_health_monitoring
        uptimekuma:
          ansible_host: 10.10.10.13
          guest_type: lxc
          vmid: 909
          vlan_id: 10
          guest_os: Alpine Linux
          vcpu: 1
          memory_mb: 128
          role: uptime_monitoring

    ai_workloads:
      hosts:
        ollama:
          ansible_host: 10.10.10.12
          guest_type: lxc
          vmid: 908
          vlan_id: 10
          guest_os: Debian
          vcpu: 4
          memory_mb: 2048
          role: local_llm

    home_automation:
      hosts:
        homeassistant:
          ansible_host: 10.10.50.10
          guest_type: lxc
          vmid: 906
          vlan_id: 50
          guest_os: Debian
          vcpu: 2
          memory_mb: 1024
          role: home_assistant

    iot:
      children:
        mqtt:
          hosts:
            mosquitto:
              ansible_host: 10.10.50.17
              guest_type: lxc
              vmid: 913
              vlan_id: 50
              guest_os: Alpine Linux
              vcpu: 1
              memory_mb: 256
              role: mqtt_broker
        device_management:
          hosts:
            esphome:
              ansible_host: 10.10.50.18
              guest_type: lxc
              vmid: 914
              vlan_id: 50
              guest_os: Debian
              vcpu: 2
              memory_mb: 1536
              role: esphome_device_manager

    cybersecurity:
      children:
        siem:
          hosts:
            wazuh:
              ansible_host: 10.10.10.16
              guest_type: lxc
              vmid: 912
              vlan_id: 10
              guest_os: Debian
              vcpu: 4
              memory_mb: 6144
              role: siem_xdr
              wazuh_api_port: 55000
              wazuh_agent_port: 1514
              wazuh_enrollment_port: 1515
        analysis:
          hosts:
            remnux:
              guest_type: qemu
              vmid: 905
              vlan_id: 30
              guest_os: REMnux
              role: malware_analysis
            metasploitable2:
              guest_type: qemu
              vmid: 902
              vlan_id: 30
              guest_os: Metasploitable 2
              role: vulnerable_training_target
            securityonion:
              guest_type: qemu
              vmid: 904
              vlan_id: 30
              guest_os: Security Onion
              role: network_security_monitoring
            owasp:
              ansible_host: 10.10.10.15
              guest_type: lxc
              vmid: 911
              vlan_id: 10
              guest_os: Alpine Linux
              role: web_security_testing

    honeypots:
      hosts:
        tpot-honeypot:
          guest_type: qemu
          vmid: 903
          vlan_id: 40
          guest_os: T-Pot
          role: multi_honeypot

    active_directory:
      children:
        windows_guests:
          vars:
            ansible_user: Administrator
            ansible_connection: winrm
            ansible_port: 5986
            ansible_winrm_transport: ntlm
            ansible_winrm_server_cert_validation: ignore
            vlan_id: 20
          children:
            domain_controllers:
              hosts:
                ad2025:
                  vmid: 940
                  guest_os: Windows Server 2025
                ad2022:
                  vmid: 941
                  guest_os: Windows Server 2022
                ad2019:
                  vmid: 942
                  guest_os: Windows Server 2019
                ad2016:
                  vmid: 943
                  guest_os: Windows Server 2016
                ad2012:
                  vmid: 944
                  guest_os: Windows Server 2012 R2
                ad2008:
                  vmid: 945
                  guest_os: Windows Server 2008 R2
            domain_clients:
              hosts:
                adwin10:
                  vmid: 946
                  guest_os: Windows 10
                adwin11:
                  vmid: 947
                  guest_os: Windows 11
                adwin7:
                  vmid: 948
                  guest_os: Windows 7
            legacy_windows:
              hosts:
                ad2003:
                  vmid: 950
                  guest_os: Windows Server 2003 R2
        linux_members:
          hosts:
            adrhel:
              vmid: 949
              vlan_id: 20
              guest_type: qemu
              guest_os: RHEL 9.8
