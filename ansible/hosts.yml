---
# Inventory contains only the ten currently installed guests.
# Windows hosts resolve through DNS; add ansible_host via private overrides
# when static management addresses are known.
all:
  vars:
    ansible_python_interpreter: auto_silent

  children:
    network:
      hosts:
        opnsense:
          ansible_host: 10.10.10.1
          ansible_user: root
          guest_type: qemu
          vmid: 900
          guest_os: OPNsense

    home_automation:
      hosts:
        homeassistant:
          ansible_host: 10.10.50.10
          ansible_user: root
          guest_type: lxc
          vmid: 906
          vlan_id: 50
          guest_os: Debian
          vcpu: 2
          memory_mb: 1024
          role: home_assistant

    observability:
      hosts:
        monitoring:
          ansible_host: 10.10.10.14
          ansible_user: root
          guest_type: lxc
          vmid: 910
          vlan_id: 10
          guest_os: Alpine Linux
          vcpu: 1
          memory_mb: 256
          role: prometheus_grafana_loki
        wazuh:
          ansible_host: 10.10.10.16
          ansible_user: root
          guest_type: lxc
          vmid: 912
          vlan_id: 10
          guest_os: Debian
          vcpu: 4
          memory_mb: 6144
          role: siem_xdr
          wazuh_api_port: 55000
          wazuh_agent_port: 1514
          wazuh_enrollment_port: 1515

    iot:
      children:
        mqtt:
          hosts:
            mosquitto:
              ansible_host: 10.10.50.17
              ansible_user: root
              guest_type: lxc
              vmid: 913
              vlan_id: 50
              guest_os: Alpine Linux
              vcpu: 1
              memory_mb: 256
              role: mqtt_broker
        device_management:
          hosts:
            esphome:
              ansible_host: 10.10.50.18
              ansible_user: root
              guest_type: lxc
              vmid: 914
              vlan_id: 50
              guest_os: Debian
              vcpu: 2
              memory_mb: 1536
              role: esphome_device_manager

    windows_guests:
      vars:
        ansible_user: Administrator
        ansible_password: "{{ vault_windows_admin_password }}"
        ansible_connection: winrm
        ansible_port: 5986
        ansible_winrm_transport: ntlm
        ansible_winrm_server_cert_validation: ignore
      hosts:
        dc:
          vmid: 941
          guest_type: qemu
          guest_os: Windows Server 2022
          role: domain_controller
        server1:
          vmid: 943
          guest_type: qemu
          guest_os: Windows Server 2016
          role: member_server
        client:
          vmid: 946
          guest_type: qemu
          guest_os: Windows 10
          role: domain_client
        malware-analysis:
          vmid: 931
          guest_type: qemu
          guest_os: Windows 10
          role: malware_analysis
