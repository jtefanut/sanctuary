---
all:
  vars:
    ansible_python_interpreter: auto_silent
    ansible_user: root
  children:
    network:
      hosts:
        opnsense:
          ansible_host: 10.10.10.1
          guest_type: qemu
          vmid: 900
          guest_os: OPNsense
          role: firewall_router
          ansible_connection: httpapi

    observability:
      hosts:
        monitoring:
          ansible_host: 10.10.10.14
          guest_type: lxc
          vmid: 910
          guest_os: Alpine Linux
          vcpu: 1
          memory_mb: 256
          role: prometheus_grafana_loki

    home_automation:
      hosts:
        homeassistant:
          ansible_host: 10.10.10.10
          guest_type: lxc
          vmid: 906
          guest_os: Debian
          vcpu: 2
          memory_mb: 1024
          role: home_assistant

    iot:
      children:
        mqtt:
          hosts:
            mosquitto:
              ansible_host: 10.10.10.17
              guest_type: lxc
              vmid: 913
              guest_os: Alpine Linux
              vcpu: 1
              memory_mb: 256
              role: mqtt_broker
        device_management:
          hosts:
            esphome:
              ansible_host: 10.10.10.18
              guest_type: lxc
              vmid: 914
              guest_os: Debian
              vcpu: 2
              memory_mb: 1536
              role: esphome_device_manager

    cybersecurity:
      children:
        siem:
          hosts:
            wazuh:
              ansible_host: 10.10.10.16
              guest_type: lxc
              vmid: 912
              guest_os: Debian
              vcpu: 4
              memory_mb: 6144
              role: siem_xdr
              wazuh_api_port: 55000
              wazuh_agent_port: 1514
              wazuh_enrollment_port: 1515
        analysis:
          hosts:
            remnux:
              guest_type: qemu
              vmid: 905
              guest_os: REMnux
              role: malware_analysis
            metasploitable2:
              guest_type: qemu
              vmid: 902
              guest_os: Metasploitable 2
              role: vulnerable_training_target
            securityonion:
              guest_type: qemu
              vmid: 904
              guest_os: Security Onion
              role: network_security_monitoring

    active_directory:
