all:
  children:
    virtualization:
      children:
        proxmox_guests:
          children:
            network:
              hosts:
                opnsense:
                  # service_config omitted from the public example
                  guest_type: qemu
                  guest_os: OPNsense
                  vcpu: 1
                  memory_mb: 1024
                  autostart: true
                  role: firewall_router
                  ansible_connection: httpapi

            active_directory:
              children:
                domain_controllers:
                  hosts:
                    dc:
                      # service_config omitted from the public example
                      guest_type: qemu
                      guest_os: Windows Server 2022
                      vcpu: 2
                      memory_mb: 4096
                      role: active_directory_domain_controller
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore
                member_servers:
                  hosts:
                    sv1:
                      # service_config omitted from the public example
                      guest_type: qemu
                      guest_os: Windows Server 2016
                      vcpu: 2
                      memory_mb: 3072
                      role: active_directory_member_server
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore
                    sv2:
                      # service_config omitted from the public example
                      guest_type: qemu
                      guest_os: Windows Server 2012 R2
                      vcpu: 2
                      memory_mb: 1024
                      role: active_directory_member_server
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore
                clients:
                  hosts:
                    client:
                      # service_config omitted from the public example
                      guest_type: qemu
                      guest_os: Windows 10
                      vcpu: 2
                      memory_mb: 2560
                      role: active_directory_client
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore

            iot:
              children:
                home_automation:
                  hosts:
                    homeassistant:
                      # service_config omitted from the public example
                      guest_type: lxc
                      guest_os: Alpine Linux
                      vcpu: 1
                      memory_mb: 1024
                      autostart: true
                      role: home_assistant
                      service_port: 8123
                      ansible_user: deploy
                mqtt:
                  hosts:
                    mosquitto:
                      # service_config omitted from the public example
                      guest_type: lxc
                      guest_os: Alpine Linux
                      vcpu: 1
                      memory_mb: 96
                      autostart: false
                      role: mqtt_broker
                      service_port: 1883
                      ansible_user: deploy
                device_management:
                  hosts:
                    esphome:
                      # service_config omitted from the public example
                      guest_type: lxc
                      guest_os: Ubuntu
                      vcpu: 2
                      memory_mb: 1536
                      autostart: false
                      role: esphome_device_manager
                      ansible_user: deploy

            cybersecurity:
              children:
                siem:
                  hosts:
                    wazuh:
                      # service_config omitted from the public example
                      guest_type: lxc
                      guest_os: Ubuntu
                      vcpu: 4
                      memory_mb: 4096
                      autostart: true
                      role: siem_xdr
                      ansible_user: deploy
                      wazuh_api_port: 55000
                      wazuh_agent_port: 1514
                      wazuh_enrollment_port: 1515
                security_workstations:
                  hosts:
                    parrot:
                      # service_config omitted from the public example
                      guest_type: qemu
                      guest_os: Parrot Security OS
                      vcpu: 1
                      memory_mb: 1536
                      role: security_testing_workstation
                      ansible_user: user
                malware_analysis:
                  hosts:
                    sandbox:
                      # service_config omitted from the public example
                      guest_type: qemu
                      guest_os: Windows 10
                      vcpu: 2
                      memory_mb: 2560
                      role: isolated_analysis_sandbox
                      ansible_connection: winrm
                      ansible_winrm_transport: ntlm
                      ansible_port: 5986
                      ansible_winrm_server_cert_validation: ignore

    observability:
      hosts:
        monitoring:
          # service_config omitted from the public example
          guest_type: lxc
          guest_os: Alpine Linux
          vcpu: 1
          memory_mb: 256
          autostart: false
          role: metrics_and_logging
          ansible_user: deploy
          prometheus_port: 9090
          grafana_port: 3000
          loki_port: 3100

  vars:
    ansible_python_interpreter: auto_silent

