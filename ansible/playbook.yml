---
- name: Deploy observability stack
  hosts: observability
  become: true
  gather_facts: false
  vars:
    service_dir: /opt/homelab/monitoring
  tasks:
    - name: Bootstrap Python for Ansible modules
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y python3
          else
            echo "Unsupported package manager; install Python 3 manually" >&2
            exit 1
          fi
        fi
      changed_when: false

    - name: Gather host facts after Python bootstrap
      ansible.builtin.setup:

    - name: Install and start Docker Engine and Compose
      ansible.builtin.raw: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache docker docker-cli-compose
          rc-update add docker default
          rc-service docker start
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose
          systemctl enable --now docker
        else
          echo "Unsupported package manager; install Docker Engine and Compose manually" >&2
          exit 1
        fi
      changed_when: false

    - name: Verify Docker Compose is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Require a Grafana administrator password
      ansible.builtin.assert:
        that:
          - grafana_admin_password is defined
          - grafana_admin_password | default('') | length >= 16
        fail_msg: "Pass grafana_admin_password via Ansible Vault or --extra-vars (minimum 16 characters)."

    - name: Create monitoring service directory
      ansible.builtin.file:
        path: "{{ service_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy monitoring Compose definition
      ansible.builtin.copy:
        src: ../services/x64/monitoring/docker-compose.yml
        dest: "{{ service_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Prepare Grafana persistent data directory
      ansible.builtin.file:
        path: "{{ service_dir }}/grafana-data"
        state: directory
        owner: "472"
        group: "472"
        mode: "0750"

    - name: Prepare Prometheus persistent data directory
      ansible.builtin.file:
        path: "{{ service_dir }}/prometheus-data"
        state: directory
        owner: "65534"
        group: "65534"
        mode: "0750"

    - name: Prepare Loki persistent data directory
      ansible.builtin.file:
        path: "{{ service_dir }}/loki-data"
        state: directory
        owner: "10001"
        group: "10001"
        mode: "0750"

    - name: Prepare Alloy persistent data directory
      ansible.builtin.file:
        path: "{{ service_dir }}/alloy-data"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy Grafana datasource provisioning
      ansible.builtin.copy:
        src: ../services/x64/monitoring/grafana-datasources.yaml
        dest: "{{ service_dir }}/grafana-datasources.yaml"
        owner: root
        group: root
        mode: "0644"

    - name: Copy Prometheus configuration
      ansible.builtin.copy:
        src: ../services/x64/monitoring/prometheus.yml
        dest: "{{ service_dir }}/prometheus.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Install Loki configuration
      ansible.builtin.copy:
        src: ../services/x64/monitoring/loki-config.yaml
        dest: "{{ service_dir }}/loki-config.yaml"
        owner: root
        group: root
        mode: "0644"

    - name: Install Grafana Alloy configuration
      ansible.builtin.copy:
        src: ../services/x64/monitoring/alloy-config.alloy
        dest: "{{ service_dir }}/alloy-config.alloy"
        owner: root
        group: root
        mode: "0644"

    - name: Write private Compose environment file
      ansible.builtin.copy:
        content: "GRAFANA_ADMIN_PASSWORD={{ grafana_admin_password }}\n"
        dest: "{{ service_dir }}/.env"
        owner: root
        group: root
        mode: "0600"
      no_log: true

    - name: Start monitoring stack
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ service_dir }}"
      register: monitoring_compose
      changed_when: "'Created' in monitoring_compose.stdout or 'Started' in monitoring_compose.stdout or 'Recreated' in monitoring_compose.stdout"

- name: Deploy Home Assistant
  hosts: home_automation
  become: true
  gather_facts: false
  vars:
    service_dir: /opt/homelab/homeassistant
  tasks:
    - name: Bootstrap Python for Ansible modules
      ansible.builtin.raw: |
        if ! command -v python3 >/dev/null 2>&1; then
          if command -v apk >/dev/null 2>&1; then
            apk add --no-cache python3
          elif command -v apt-get >/dev/null 2>&1; then
            apt-get update && apt-get install -y python3
          else
            echo "Unsupported package manager; install Python 3 manually" >&2
            exit 1
          fi
        fi
      changed_when: false

    - name: Gather host facts after Python bootstrap
      ansible.builtin.setup:

    - name: Install and start Docker Engine and Compose
      ansible.builtin.raw: |
        if command -v apk >/dev/null 2>&1; then
          apk add --no-cache docker docker-cli-compose
          rc-update add docker default
          rc-service docker start
        elif command -v apt-get >/dev/null 2>&1; then
          apt-get update
          DEBIAN_FRONTEND=noninteractive apt-get install -y docker.io docker-compose
          systemctl enable --now docker
        else
          echo "Unsupported package manager; install Docker Engine and Compose manually" >&2
          exit 1
        fi
      changed_when: false

    - name: Verify Docker Compose is available
      ansible.builtin.command: docker compose version
      changed_when: false

    - name: Create Home Assistant service directory
      ansible.builtin.file:
        path: "{{ service_dir }}"
        state: directory
        owner: root
        group: root
        mode: "0750"

    - name: Copy Home Assistant Compose definition
      ansible.builtin.copy:
        src: ../services/x64/homeassistant/docker-compose.yml
        dest: "{{ service_dir }}/docker-compose.yml"
        owner: root
        group: root
        mode: "0644"

    - name: Start Home Assistant
      ansible.builtin.command: docker compose up -d
      args:
        chdir: "{{ service_dir }}"
      register: homeassistant_compose
      changed_when: "'Created' in homeassistant_compose.stdout or 'Started' in homeassistant_compose.stdout or 'Recreated' in homeassistant_compose.stdout"
