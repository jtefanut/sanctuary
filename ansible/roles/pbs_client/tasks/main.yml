---
- name: Install proxmox-backup-client on Proxmox node
  apt:
    name: proxmox-backup-client
    state: present
    update_cache: yes
  when: ansible_os_family == "Debian"

- name: Configure daily PBS backup job
  cron:
    name: "Automated Host PBS Backup"
    minute: "0"
    hour: "2"
    job: "proxmox-backup-client backup root.pxar:/ --repository BACKUP_USER@BACKUP_HOST:8007:BACKUP_DATASTORE >> /var/log/pbs-backup.log 2>&1"
    user: root
