# Reference only; generated guest is managed by Terraform as VMID 906.
arch: amd64
cores: 2
features: nesting=1,keyctl=1
hostname: homeassistant
memory: 1024
swap: 1024
nameserver: 10.10.10.1
net0: name=eth0,bridge=vmbr0,firewall=1,tag=10,ip=10.10.10.10/24,gw=10.10.10.1,type=veth
onboot: 1
ostype: debian
rootfs: local-lvm:vm-906-disk-0,size=16G
unprivileged: 0
