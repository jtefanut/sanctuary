# Reference only; generated guest is managed by Terraform as VMID 910.
arch: amd64
cores: 1
features: nesting=1,keyctl=1
hostname: monitoring
memory: 256
swap: 128
nameserver: 10.10.10.1
net0: name=eth0,bridge=vmbr0,firewall=1,tag=10,ip=10.10.10.14/24,gw=10.10.10.1,type=veth
onboot: 0
ostype: alpine
rootfs: local-lvm:vm-910-disk-0,size=4G
unprivileged: 0
