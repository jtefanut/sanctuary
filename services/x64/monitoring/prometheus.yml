# Targets managed outside this repository remain explicit integration points.
global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: homelab-enterprise

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  - job_name: monitoring-node-exporter
    static_configs:
      - targets: ["node-exporter:9100"]
        labels:
          node: monitoring

  - job_name: loki
    static_configs:
      - targets: ["loki:3100"]

  - job_name: node1-pve-x64
    static_configs:
      - targets: ["10.10.10.22:9100"]
        labels:
          node: pve-primary
          arch: x86_64

  - job_name: opnsense-firewall
    static_configs:
      - targets: ["10.10.10.21:9273"]
        labels:
          node: opnsense-exporter
          role: perimeter-firewall

  - job_name: omv-nas
    static_configs:
      - targets: ["10.10.10.23:9100"]
        labels:
          node: omv-storage

  - job_name: kubernetes-worker
    static_configs:
      - targets: ["10.10.10.20:9100"]
        labels:
          node: kubernetes-node
