# Reference configuration aligned with terraform/main.tf (VMID 900).
agent: 0
balloon: 1024
boot: order=scsi0;ide2;net0
cores: 2
cpu: host
ide2: local:iso/OPNsense-dvd-amd64.iso,media=cdrom
memory: 2048
name: opnsense
net0: virtio=02:00:00:00:00:01,bridge=vmbr1,firewall=0
net1: virtio=02:00:00:00:00:02,bridge=vmbr0,firewall=0
net2: virtio=02:00:00:00:00:03,bridge=vmbr2,firewall=0
numa: 0
onboot: 1
ostype: other
scsi0: local-lvm:vm-900-disk-0,discard=on,iothread=1,size=16G,ssd=1
scsihw: virtio-scsi-single
sockets: 1
vga: none
