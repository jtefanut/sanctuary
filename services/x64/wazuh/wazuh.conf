# Wazuh SIEM/XDR LXC reference.
# Terraform guest: VMID 912, hostname wazuh, 10.10.10.16/24, VLAN 10.
# Resources: 4 vCPU, 6144 MB RAM, 35 GB root disk, Debian template.
# Ports: 9200/tcp indexer; 1514/tcp agents; 1515/tcp enrollment;
#        55000/tcp API; 443/tcp dashboard; 514/udp syslog (if enabled).
#
# Configure the Wazuh indexer/manager/dashboard packages and TLS separately.
# The settings below describe intended service configuration; this file is not
# a native Wazuh ossec.conf and is not consumed automatically by the service.
#
# Suggested ingestion sources: OPNsense filterlog, Suricata EVE JSON,
# Proxmox audit events and enrolled endpoint agents.
# Example local rule IDs reserved for the lab: 100100-100102.
